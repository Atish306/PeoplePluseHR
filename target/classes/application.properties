# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ===================================================================
# Thymeleaf Template Settings
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ===================================================================
# Logging
# ===================================================================
logging.level.com.atish.attendance=DEBUG
logging.level.org.springframework.security=INFO

# ===================================================================
# Geofencing Enforcement Configuration
# ===================================================================
attendance.geofence.enabled=true
attendance.geofence.office-name=Pune Headquarters
attendance.geofence.latitude=18.5204
attendance.geofence.longitude=73.8567
attendance.geofence.radius-meters=200.0

# ===================================================================
# Email Notification Configuration (Demo Bookings & Alerts)
# ===================================================================
app.mail.enabled=false
app.mail.from=no-reply@peoplepulsehr.com
app.mail.admin-email=sales@peoplepulsehr.com
