# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=PeoplePulse HR Attendance Management System
server.port=8085

# ===================================================================
# Primary Database: MySQL 8.0 Configuration
# Database: peoplepulse_db (on localhost:3306)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/peoplepulse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console when using MySQL
spring.h2.console.enabled=false

# ===================================================================
# Fallback / Alternative: Embedded H2 Configuration (Commented)
# ===================================================================
# spring.datasource.url=jdbc:h2:file:./data/attendancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
